info:
  contact: {}
  description: Online banking API. Single currency INR; amounts are decimal strings
    with 2 places. Authentication uses a session cookie.
  title: Online Banking Mini Application API
  version: "1.0"
paths:
  /accounts:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/bank-app-ioc_backend_internal_account.Account'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: List accounts
      tags:
      - accounts
  /accounts/{accountId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Account UUID, e.g. 7f4e2a10-8c3d-4b91-a6e2-1d5f7c9b2048
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/bank-app-ioc_backend_internal_account.Account'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Get account
      tags:
      - accounts
  /accounts/{accountId}/transactions:
    get:
      consumes:
      - application/json
      parameters:
      - description: Account UUID, e.g. 7f4e2a10-8c3d-4b91-a6e2-1d5f7c9b2048
        in: path
        name: accountId
        required: true
        type: string
      - description: Transaction type, e.g. CREDIT
        enum:
        - DEBIT
        - CREDIT
        in: query
        name: type
        type: string
      - description: Page number, e.g. 1
        in: query
        name: page
        type: integer
      - description: Page size, e.g. 20
        in: query
        name: pageSize
        type: integer
      - description: Sort field, e.g. createdAt
        enum:
        - createdAt
        - amount
        - type
        in: query
        name: sort
        type: string
      - description: Sort direction, e.g. DESC
        enum:
        - ASC
        - DESC
        in: query
        name: direction
        type: string
      - description: RFC3339 start time, e.g. 2026-10-01T00:00:00Z
        in: query
        name: from
        type: string
      - description: RFC3339 end time, e.g. 2026-10-31T23:59:59Z
        in: query
        name: to
        type: string
      - description: Minimum amount, e.g. 100.00
        in: query
        name: minAmount
        type: string
      - description: Maximum amount, e.g. 5000.00
        in: query
        name: maxAmount
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/bank-app-ioc_backend_internal_account.Transaction'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: List account transactions
      tags:
      - accounts
  /admin/account-assignments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Assignment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_admin.AssignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/bank-app-ioc_backend_internal_admin.AssignmentDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      - CSRFToken: []
      summary: Assign account
      tags:
      - admin
  /admin/audit-events:
    get:
      consumes:
      - application/json
      parameters:
      - description: Event type, e.g. USER_CREATED
        in: query
        name: eventType
        type: string
      - description: Actor user UUID, e.g. 4e8a1c53-7b20-4d96-a5f1-9c2e6b804317
        in: query
        name: actorUserId
        type: string
      - description: Entity type, e.g. USER
        in: query
        name: entityType
        type: string
      - description: Entity UUID, e.g. 4e8a1c53-7b20-4d96-a5f1-9c2e6b804317
        in: query
        name: entityId
        type: string
      - description: Result, e.g. SUCCESS
        in: query
        name: result
        type: string
      - description: RFC3339 start time, e.g. 2026-10-01T00:00:00Z
        in: query
        name: from
        type: string
      - description: RFC3339 end time, e.g. 2026-10-31T23:59:59Z
        in: query
        name: to
        type: string
      - description: Page number, e.g. 1
        in: query
        name: page
        type: integer
      - description: Page size, e.g. 25
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/bank-app-ioc_backend_internal_admin.AuditEvent'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Search audit events
      tags:
      - admin
  /admin/config/transaction-limit:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/bank-app-ioc_backend_internal_admin.LimitDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Get transaction limit
      tags:
      - admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: Limit request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_admin.LimitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/bank-app-ioc_backend_internal_admin.LimitDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      - CSRFToken: []
      summary: Set transaction limit
      tags:
      - admin
  /admin/users:
    get:
      consumes:
      - application/json
      parameters:
      - description: Username substring, e.g. nisha
        in: query
        name: search
        type: string
      - description: User role, e.g. OPERATIONS
        in: query
        name: role
        type: string
      - description: User status, e.g. ACTIVE
        in: query
        name: status
        type: string
      - description: Page number, e.g. 1
        in: query
        name: page
        type: integer
      - description: Page size, e.g. 25
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/bank-app-ioc_backend_internal_admin.UserDTO'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: List users
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: User request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_admin.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/bank-app-ioc_backend_internal_admin.UserDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
