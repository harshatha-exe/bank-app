          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Get account
      tags:
      - accounts
  /accounts/{accountId}/transactions:
    get:
      consumes:
      - application/json
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Transaction type
        enum:
        - DEBIT
        - CREDIT
        in: query
        name: type
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      - description: Sort field
        enum:
        - createdAt
        - amount
        - type
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - ASC
        - DESC
        in: query
        name: direction
        type: string
      - description: RFC3339 start time
        in: query
        name: from
        type: string
      - description: RFC3339 end time
        in: query
        name: to
        type: string
      - description: Minimum amount
        in: query
        name: minAmount
        type: string
      - description: Maximum amount
        in: query
        name: maxAmount
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: List account transactions
      tags:
      - accounts
