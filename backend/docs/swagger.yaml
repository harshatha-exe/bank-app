basePath: /api
definitions:
  bank-app-ioc_backend_internal_httpx.ErrorBody:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  bank-app-ioc_backend_internal_httpx.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorBody'
      meta:
        additionalProperties: true
        type: object
    type: object
  bank-app-ioc_backend_internal_httpx.Response:
    properties:
      data: {}
      meta:
        additionalProperties: true
        type: object
    type: object
  internal_admin.AssignRequest:
    properties:
      accountId:
        type: string
      operationsUserId:
        type: string
    type: object
  internal_admin.CreateUserRequest:
    properties:
      fullName:
        description: required only when role is CUSTOMER
        type: string
      role:
        type: string
      temporaryPassword:
        type: string
      username:
        type: string
    type: object
  internal_admin.LimitRequest:
    properties:
      maxTransferAmount:
        type: string
    type: object
  internal_admin.ResetPasswordRequest:
    properties:
      newPassword:
        type: string
    type: object
  internal_admin.RoleRequest:
    properties:
      role:
        type: string
    type: object
  internal_admin.StatusRequest:
    properties:
      status:
        type: string
    type: object
  internal_auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal_auth.SignupRequest:
    properties:
      fullName:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  internal_beneficiary.CreateRequest:
    properties:
      destinationAccountId:
        type: string
      nickname:
        type: string
    type: object
  internal_beneficiary.StatusRequest:
    properties:
      status:
        type: string
    type: object
  internal_transfer.CreateRequest:
    properties:
      amount:
        type: string
      beneficiaryId:
        type: string
      destinationAccountId:
        type: string
      purpose:
        type: string
      sourceAccountId:
        type: string
    type: object
info:
  contact: {}
  description: Online banking API. Single currency INR; amounts are decimal strings
    with 2 places. Authentication uses a session cookie.
  title: Online Banking Mini Application API
  version: "1.0"
paths:
  /accounts:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
      security:
      - SessionAuth: []
      summary: List accounts
      tags:
      - accounts
  /accounts/{accountId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bank-app-ioc_backend_internal_httpx.ErrorResponse'
        "404":
